<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placement Eligibility Checker — Student Toolkit</title>
  <meta name="description" content="Check your eligibility against recruiter criteria: CGPA, backlogs, branch and graduation year.">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('st-theme'));if(t)document.documentElement.setAttribute('data-theme',t);else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M19 9.5L12 6 5 9.5l7 3.5 7-3.5z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M8 11.5v3.5c0 1 1.8 2 4 2s4-1 4-2v-3.5' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a><span class="sep">/</span>
        <a href="../pages/career.html">Career</a><span class="sep">/</span>
        <span aria-current="page">Eligibility Checker</span>
      </nav>
      <h1>Placement Eligibility Checker</h1>
      <p class="lead">Enter your details once — instantly see which sample recruiters you qualify for, and exactly why or why not.</p>
    </div>

    <div class="tool-layout">
      <div class="card">
        <div class="form-row">
          <div class="field">
            <label for="cgpa">Your CGPA</label>
            <input type="number" id="cgpa" min="0" max="10" step="0.01" placeholder="e.g. 8.1">
          </div>
          <div class="field">
            <label for="backlogs">Active backlogs</label>
            <input type="number" id="backlogs" min="0" max="20" step="1" placeholder="0">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="branch">Branch</label>
            <select id="branch">
              <option value="">Select branch</option>
              <option>CSE</option><option>IT</option><option>ENTC</option>
              <option>EEE</option><option>MECH</option><option>CIVIL</option>
            </select>
          </div>
          <div class="field">
            <label for="year">Graduation year</label>
            <select id="year">
              <option value="">Select year</option>
              <option>2026</option><option>2027</option><option>2028</option><option>2029</option>
            </select>
          </div>
        </div>
        <div class="error-text" id="err"></div>
        <div class="tool-actions">
          <button class="btn btn-primary" id="check">Check eligibility</button>
        </div>
      </div>

      <div class="result" id="result" aria-live="polite">
        <div class="result-grid" style="margin:0 0 16px" id="summary"></div>
        <div id="compList"></div>
        <p class="small muted" style="margin-top:14px">These are sample criteria for demonstration. Replace them with your college's actual recruiter criteria in <code>js/data.js</code>.</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../js/auth.js"></script>
  <script src="../js/eligibility.js"></script>
</body>
</html>
