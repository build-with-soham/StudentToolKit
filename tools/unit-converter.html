<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter — Student Toolkit</title>
  <meta name="description" content="Convert length, weight, temperature and data storage units instantly.">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('st-theme'));if(t)document.documentElement.setAttribute('data-theme',t);else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M19 9.5L12 6 5 9.5l7 3.5 7-3.5z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M8 11.5v3.5c0 1 1.8 2 4 2s4-1 4-2v-3.5' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a><span class="sep">/</span>
        <a href="../pages/engineering.html">Engineering</a><span class="sep">/</span>
        <span aria-current="page">Unit Converter</span>
      </nav>
      <h1>Unit Converter</h1>
      <p class="lead">Length, weight, temperature and data storage — converted instantly as you type.</p>
    </div>

    <div class="tool-layout">
      <div class="card">
        <div class="field" style="max-width:320px">
          <label for="cat">Category</label>
          <select id="cat">
            <option value="length">Length</option>
            <option value="weight">Weight / Mass</option>
            <option value="temperature">Temperature</option>
            <option value="data">Data Storage</option>
          </select>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="fromVal">Value</label>
            <input type="number" id="fromVal" step="any" placeholder="Enter value">
          </div>
          <div class="field">
            <label for="fromUnit">From</label>
            <select id="fromUnit"></select>
          </div>
        </div>

        <button class="conv-swap" id="swap" aria-label="Swap units" title="Swap units">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
        </button>

        <div class="field" style="max-width:none;margin-top:14px">
          <label for="toUnit">To</label>
          <select id="toUnit"></select>
        </div>

        <div class="conv-out" id="output" aria-live="polite">—</div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px">Notes</h3>
        <p class="small muted">Temperature conversions use exact formulas (°C, °F, K) rather than ratio multiplication.</p>
        <p class="small muted" style="margin-top:10px">Data storage uses binary units where 1 KB = 1024 bytes.</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../js/auth.js"></script>
  <script src="../js/converter.js"></script>
</body>
</html>
