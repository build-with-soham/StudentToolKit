<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Student Toolkit</title>
  <meta name="description" content="Your student dashboard: quick tools, progress and upcoming deadlines.">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('st-theme'));if(t)document.documentElement.setAttribute('data-theme',t);else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M19 9.5L12 6 5 9.5l7 3.5 7-3.5z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M8 11.5v3.5c0 1 1.8 2 4 2s4-1 4-2v-3.5' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="container">
    <div class="dash-greet">
      <div>
        <h1 id="greeting">Welcome back, Student.</h1>
        <p class="muted" id="greetSub">Here is your progress at a glance.</p>
      </div>
      <button class="btn btn-secondary btn-sm no-print" id="editNameBtn">Set your name</button>
    </div>

    <!-- Quick tools -->
    <section style="padding:18px 0 8px">
      <h2 style="font-size:1.15rem;margin-bottom:14px">Quick tools</h2>
      <div class="quick-tools">
        <a href="../tools/sgpa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5M4 15l5-6 4 4 7-8"/></svg>SGPA</a>
        <a href="../tools/cgpa.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-5"/></svg>CGPA</a>
        <a href="../tools/attendance.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Attendance</a>
        <a href="../tools/resume-builder.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M9 13h6M9 17h6M9 9h2"/></svg>Resume</a>
        <a href="opportunities.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Opportunities</a>
      </div>
    </section>

    <!-- Progress -->
    <section style="padding:26px 0 8px">
      <h2 style="font-size:1.15rem;margin-bottom:14px">Progress</h2>
      <div class="grid grid-4" id="statsGrid"></div>
    </section>

    <!-- Upcoming -->
    <section style="padding:26px 0 32px">
      <h2 style="font-size:1.15rem;margin-bottom:14px">Upcoming deadlines</h2>
      <div class="card" id="deadlinesCard"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
