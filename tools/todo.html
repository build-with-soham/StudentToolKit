<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List — Student Toolkit</title>
  <meta name="description" content="Simple task manager for students — tasks with optional due dates, saved in your browser.">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('st-theme'));if(t)document.documentElement.setAttribute('data-theme',t);else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M19 9.5L12 6 5 9.5l7 3.5 7-3.5z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M8 11.5v3.5c0 1 1.8 2 4 2s4-1 4-2v-3.5' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Home</a><span class="sep">/</span>
        <a href="../pages/productivity.html">Productivity</a><span class="sep">/</span>
        <span aria-current="page">To-Do List</span>
      </nav>
      <h1>To-Do List</h1>
      <p class="lead">Assignments, deadlines, revision tasks — add them here. Tasks are saved in your browser automatically.</p>
    </div>

    <div class="tool-layout">
      <div class="card">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">
          <input type="text" id="taskText" placeholder="e.g. Communication Systems — Unit 3" maxlength="120" style="flex:2;min-width:200px" aria-label="Task description">
          <input type="date" id="taskDue" style="flex:1;min-width:150px" aria-label="Due date (optional)">
          <button class="btn btn-primary" id="addBtn">Add task</button>
        </div>
        <div class="error-text" id="err"></div>

        <div class="filter-bar" style="margin:16px 0 14px">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="active">Active</button>
          <button class="chip" data-filter="done">Completed</button>
          <span class="spacer"></span>
          <span class="small muted" id="countLabel"></span>
        </div>

        <div id="list"></div>
        <div class="empty-state" id="emptyState">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
          <p>No tasks yet. Add your first task above.</p>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="../js/auth.js"></script>
  <script src="../js/todo.js"></script>
</body>
</html>
